# AgentHub local development infrastructure.
#
# PostgreSQL is intentionally NOT here: it runs on the host (see .env
# DATABASE_URL=...@localhost:5432). Only supporting services are Dockerized.
#
# Start:  docker compose -f docker-compose.dev.yml up -d
# Stop:   docker compose -f docker-compose.dev.yml down
#
# Note: host port 6379 is already used by another local project, so AgentHub
# Redis maps to 6380 — REDIS_URL=redis://localhost:6380/0
services:
  redis:
    image: redis:7-alpine
    container_name: agenthub-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - agenthub-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  agenthub-redis-data:
